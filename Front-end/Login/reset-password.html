<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Ather 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-box">
        <div class="login-header">
            <div class="user-icon-container">
                <i class="fa-solid fa-lock" style="color:#3574c8;font-size:36px;"></i>
            </div>
            <h1>RESET PASSWORD</h1>
        </div>

        <div id="authAlert" class="auth-alert" style="display:none;"></div>

        <!-- Form shown when token is present -->
        <form id="resetForm">
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="newPassword" placeholder="New Password (min 6 chars)" required minlength="6">
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="confirmPassword" placeholder="Confirm New Password" required minlength="6">
            </div>
            <button type="submit" class="login-btn" id="resetBtn">SET NEW PASSWORD</button>
        </form>

        <div class="switch-page-container" style="margin-top:20px;">
            <a href="login.html" class="secondary-btn">Back to Login</a>
        </div>
    </div>

    <script type="module" src="reset-password.js"></script>
</body>
</html>

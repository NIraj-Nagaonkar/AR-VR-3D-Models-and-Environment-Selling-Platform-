<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-box">
        <div class="login-header">
            <div class="user-icon-container">
                <i class="fa-regular fa-user"></i>
            </div>
            <h1>CUSTOMER LOGIN</h1>
        </div>

        <div id="authAlert" class="auth-alert" style="display: none;"></div>

        <form id="loginForm">
            <div class="input-group">
                <i class="fa-regular fa-envelope"></i>
                <input type="email" id="email" placeholder="Email ID" required>
            </div>

            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="Password" required>
            </div>

            <div class="form-actions">
                <label class="remember-me">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="forgot-password" id="forgotPasswordLink">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">LOGIN</button>

            <!-- Link to navigate to the Sign Up page -->
            <div class="switch-page-container">
                <p>Don't have an account?</p>
                <a href="sign-up.html" class="secondary-btn">CREATE ACCOUNT</a>
            </div>
        </form>
    </div>

    <!-- ── Forgot Password Modal ───────────────────────────────────────────── -->
    <div id="forgotModal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <div class="modal-header">
                <i class="fa-solid fa-key modal-icon"></i>
                <h2>Reset Password</h2>
                <p>Enter your registered email address and we'll send you a reset link.</p>
            </div>
            <div id="forgotAlert" class="auth-alert" style="display:none;"></div>
            <div class="modal-input-group">
                <i class="fa-regular fa-envelope"></i>
                <input type="email" id="forgotEmail" placeholder="Your email address">
            </div>
            <button id="forgotSubmitBtn" class="login-btn" style="margin-top:16px;">
                Send Reset Link
            </button>
            <button id="forgotCancelBtn" class="secondary-btn" style="margin-top:10px; display:block; width:100%; text-align:center; padding:11px; cursor:pointer; background:transparent; border:1px solid rgba(255,255,255,0.4); border-radius:4px; color:#fff; font-size:13px; letter-spacing:1px;">
                Cancel
            </button>
        </div>
    </div>

    <script type="module" src="login.js"></script>
</body>
</html>
